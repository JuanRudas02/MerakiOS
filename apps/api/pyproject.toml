[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneheavy-api"
version = "2.0.0"
description = "1heavy — Growth & Operations OS (API). Fusión de MerakiOS + 1heavy Stays."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "icalendar>=5.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = ["openai>=1.40"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF012", "E501"]  # Depends() en defaults; ClassVar; longitud la gobierna ruff format

[tool.ruff.lint.isort]
known-first-party = ["oneheavy"]

[tool.mypy]
python_version = "3.12"
packages = ["oneheavy"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["oneheavy"]
branch = true
