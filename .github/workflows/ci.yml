name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'

  api:
    name: API · lint · types · tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests --output-format=github
      - name: Ruff (formato)
        run: ruff format --check src tests
      - name: Mypy
        run: mypy
      - name: Pytest + cobertura
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Resumen de cobertura
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib
          p = pathlib.Path("coverage.xml")
          if p.exists():
              rate = float(ET.parse(p).getroot().get("line-rate", 0)) * 100
              print(f"### Cobertura API: {rate:.1f}%")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          if-no-files-found: ignore

  web:
    name: Web · lint · types · tests · build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Tests
        run: npm test --if-present
      - name: Build
        run: npm run build

  compose:
    name: Infra · validar compose
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.yml --env-file infra/.env config -q

  images:
    name: Docker · build de imágenes
    needs: [api, web]
    if: github.ref == 'refs/heads/main' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: false
          tags: oneheavy-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
