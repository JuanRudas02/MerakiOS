version: '3.8'

services:
  db:
    image: pgvector/pgvector:16-pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=meraki_user
      - POSTGRES_PASSWORD=meraki_password
      - POSTGRES_DB=meraki_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://meraki_user:meraki_password@db:5432/meraki_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    depends_on:
      - db

volumes:
  postgres_data:
